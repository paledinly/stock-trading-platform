spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: stock-platform-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_platform}
    username: ${DB_USERNAME:stock}
    password: ${DB_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  shutdown: graceful

kis:
  enabled: ${KIS_ENABLED:false}
  base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}
  token-refresh-skew: 5m
  connect-timeout: 3s
  read-timeout: 5s
  requests:
    minimum-interval: ${KIS_REQUEST_MIN_INTERVAL:125ms}
    quote-interval: ${KIS_QUOTE_MIN_INTERVAL:250ms}
    rate-limit-backoff: ${KIS_RATE_LIMIT_BACKOFF:500ms}
    max-retries: ${KIS_RATE_LIMIT_MAX_RETRIES:1}
  master:
    sync-enabled: ${KIS_MASTER_SYNC_ENABLED:false}
    sync-on-startup: ${KIS_MASTER_SYNC_ON_STARTUP:true}
    cron: ${KIS_MASTER_SYNC_CRON:0 30 6 * * MON-FRI}
    kospi-url: ${KIS_KOSPI_MASTER_URL:https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip}
    kosdaq-url: ${KIS_KOSDAQ_MASTER_URL:https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip}

resilience4j:
  ratelimiter:
    instances:
      kisAuth:
        limit-for-period: 1
        limit-refresh-period: 1m
        timeout-duration: 0
      kisQuote:
        limit-for-period: ${KIS_QUOTE_RATE_LIMIT:4}
        limit-refresh-period: 1s
        timeout-duration: 2s
      kisMinuteCandle:
        limit-for-period: ${KIS_MINUTE_RATE_LIMIT:5}
        limit-refresh-period: 1s
        timeout-duration: 2s
      kisDailyCandle:
        limit-for-period: ${KIS_DAILY_RATE_LIMIT:5}
        limit-refresh-period: 1s
        timeout-duration: 2s
      kisRanking:
        limit-for-period: ${KIS_RANKING_RATE_LIMIT:5}
        limit-refresh-period: 1s
        timeout-duration: 2s
  circuitbreaker:
    instances:
      kisAuth:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      kisQuote:
        ignore-exceptions:
          - com.sunmo.stockplatform.kis.config.KisRateLimitException
          - com.sunmo.stockplatform.kis.config.KisRequestRejectedException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      kisMinuteCandle:
        ignore-exceptions:
          - com.sunmo.stockplatform.kis.config.KisRateLimitException
          - com.sunmo.stockplatform.kis.config.KisRequestRejectedException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      kisDailyCandle:
        ignore-exceptions:
          - com.sunmo.stockplatform.kis.config.KisRateLimitException
          - com.sunmo.stockplatform.kis.config.KisRequestRejectedException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      kisRanking:
        ignore-exceptions:
          - com.sunmo.stockplatform.kis.config.KisRateLimitException
          - com.sunmo.stockplatform.kis.config.KisRequestRejectedException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

analytics:
  summary-cache-ttl: ${ANALYTICS_SUMMARY_CACHE_TTL:60s}

market:
  wide:
    enrichment:
      enabled: ${MARKET_WIDE_ENRICHMENT_ENABLED:true}
      capacity: ${MARKET_WIDE_ENRICHMENT_CAPACITY:200}
      max-attempts: ${MARKET_WIDE_ENRICHMENT_MAX_ATTEMPTS:3}
      max-age: ${MARKET_WIDE_ENRICHMENT_MAX_AGE:3m}
      retry-delay: ${MARKET_WIDE_ENRICHMENT_RETRY_DELAY:10s}
      poll-interval: ${MARKET_WIDE_ENRICHMENT_POLL_INTERVAL:1s}
    collection:
      ranking-limit: ${MARKET_WIDE_RANKING_LIMIT:100}
      detail-quote-budget: ${MARKET_WIDE_DETAIL_QUOTE_BUDGET:30}
      cache-max-age: ${MARKET_WIDE_QUOTE_CACHE_MAX_AGE:60s}
      tick-max-age: ${MARKET_WIDE_TICK_MAX_AGE:30s}
      exclude-structured-names: ${MARKET_WIDE_EXCLUDE_STRUCTURED_NAMES:true}
    schedule:
      enabled: ${MARKET_WIDE_SCHEDULE_ENABLED:false}
      poll-interval: ${MARKET_WIDE_POLL_INTERVAL:30s}
      scan-limit: ${MARKET_WIDE_SCAN_LIMIT:120}
      candidate-limit: ${MARKET_WIDE_CANDIDATE_LIMIT:30}
      include-etf: ${MARKET_WIDE_INCLUDE_ETF:false}
      open: ${MARKET_WIDE_OPEN:09:00}
      close: ${MARKET_WIDE_CLOSE:15:20}
      late-start: ${MARKET_WIDE_LATE_START:14:00}
      normal-interval: ${MARKET_WIDE_NORMAL_INTERVAL:5m}
      late-interval: ${MARKET_WIDE_LATE_INTERVAL:2m}
      holidays: ${MARKET_WIDE_HOLIDAYS:}
  precision:
    enabled: ${MARKET_PRECISION_ENABLED:false}
    max-subscriptions: ${MARKET_PRECISION_MAX:28}
    reserve: ${MARKET_SUBSCRIPTION_RESERVE:3}
    min-hold: ${MARKET_PRECISION_MIN_HOLD:15m}
    replace-margin: ${MARKET_PRECISION_REPLACE_MARGIN:10}
    freeze-at: ${MARKET_PRECISION_FREEZE_AT:14:50}
  performance:
    flush-interval: ${MARKET_PERFORMANCE_FLUSH_INTERVAL:1s}
  backfill:
    enabled: ${MARKET_BACKFILL_ENABLED:true}
    refresh-interval: ${MARKET_BACKFILL_REFRESH_INTERVAL:1m}
    max-requests-per-query: ${MARKET_BACKFILL_MAX_REQUESTS:14}
  realtime:
    enabled: ${MARKET_REALTIME_ENABLED:false}
    websocket-url: ${KIS_WEBSOCKET_URL:ws://ops.koreainvestment.com:21000}
    candle-watermark: ${MARKET_CANDLE_WATERMARK:2s}
    quote-ttl: ${MARKET_QUOTE_TTL:16h}
    replay-size: ${MARKET_SSE_REPLAY_SIZE:1000}
    subscription-limit: ${KIS_WEBSOCKET_SUBSCRIPTION_LIMIT:41}

watchlist:
  initial:
    enabled: ${WATCHLIST_INITIAL_ENABLED:true}

closing:
  daily-backfill:
    enabled: ${CLOSING_DAILY_BACKFILL_ENABLED:true}
    max-stocks: ${CLOSING_DAILY_BACKFILL_MAX_STOCKS:40}
    lookback-days: ${CLOSING_DAILY_BACKFILL_LOOKBACK_DAYS:120}
    refresh-interval: ${CLOSING_DAILY_BACKFILL_REFRESH_INTERVAL:1h}
    cron: ${CLOSING_DAILY_BACKFILL_CRON:0 10 8 * * MON-FRI}
  recommendation:
    minimum-coverage-minutes: ${CLOSING_MIN_COVERAGE_MINUTES:20}
    minimum-final-candles: ${CLOSING_MIN_FINAL_CANDLES:4}
    minimum-final-score: ${CLOSING_MIN_FINAL_SCORE:55}
    evaluation-start: ${CLOSING_EVALUATION_START:14:30}
    feature-freeze-at: ${CLOSING_FEATURE_FREEZE_AT:15:20}
