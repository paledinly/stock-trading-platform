spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: stock-platform-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_platform}
    username: ${DB_USERNAME:stock}
    password: ${DB_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  shutdown: graceful

kis:
  enabled: ${KIS_ENABLED:false}
  base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}
  token-refresh-skew: 5m
  connect-timeout: 3s
  read-timeout: 5s
  master:
    sync-enabled: ${KIS_MASTER_SYNC_ENABLED:false}
    sync-on-startup: ${KIS_MASTER_SYNC_ON_STARTUP:true}
    cron: ${KIS_MASTER_SYNC_CRON:0 30 6 * * MON-FRI}
    kospi-url: ${KIS_KOSPI_MASTER_URL:https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip}
    kosdaq-url: ${KIS_KOSDAQ_MASTER_URL:https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip}

resilience4j:
  ratelimiter:
    instances:
      kisAuth:
        limit-for-period: 1
        limit-refresh-period: 1m
        timeout-duration: 0
      kisQuote:
        limit-for-period: ${KIS_QUOTE_RATE_LIMIT:15}
        limit-refresh-period: 1s
        timeout-duration: 0
      kisMinuteCandle:
        limit-for-period: ${KIS_MINUTE_RATE_LIMIT:5}
        limit-refresh-period: 1s
        timeout-duration: 2s
  circuitbreaker:
    instances:
      kisAuth:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      kisQuote:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      kisMinuteCandle:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

market:
  performance:
    flush-interval: ${MARKET_PERFORMANCE_FLUSH_INTERVAL:1s}
  backfill:
    enabled: ${MARKET_BACKFILL_ENABLED:true}
    refresh-interval: ${MARKET_BACKFILL_REFRESH_INTERVAL:1m}
    max-requests-per-query: ${MARKET_BACKFILL_MAX_REQUESTS:14}
  realtime:
    enabled: ${MARKET_REALTIME_ENABLED:false}
    websocket-url: ${KIS_WEBSOCKET_URL:ws://ops.koreainvestment.com:21000}
    candle-watermark: ${MARKET_CANDLE_WATERMARK:2s}
    quote-ttl: ${MARKET_QUOTE_TTL:16h}
    replay-size: ${MARKET_SSE_REPLAY_SIZE:1000}
    subscription-limit: ${KIS_WEBSOCKET_SUBSCRIPTION_LIMIT:41}
